    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="none" stroke-linecap="round">
    <path id="ring-lit" stroke="#FF6B1A" stroke-width="10" d="M61.4 179.1L48.7 188.9M50.4 160.1L35.6 166.3M44.7 139L28.9 141.1M44.7 117L28.9 114.9M50.4 95.9L35.6 89.7M61.4 76.9L48.7 67.1M76.9 61.4L67.1 48.7M95.9 50.4L89.7 35.6M117 44.7L114.9 28.9M139 44.7L141.1 28.9M160.1 50.4L166.3 35.6M179.1 61.4L188.9 48.7"/>
