<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PhoneMic icon master. Exports: pc-app/gui/phonemic.ico (packaging/make-icons.sh),
       phone-app .../drawable/ic_launcher_{bg,fg,mono}.xml, pc-app/gui/main.cpp make_icon().
       The ring is 18 ticks over 270 degrees (r 84..100), the first 12 lit; make-icons.sh
       drops both ring paths at small sizes. -->
