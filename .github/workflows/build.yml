name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: only the release job may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist
          cp build/bin/PhoneMic dist/PhoneMic-linux
          cp build/bin/phonemic-receiver build/bin/phonemic-softphone dist/
          tar -C dist -czf PhoneMic-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-linux
          path: PhoneMic-linux-x64.tar.gz

  sanitizers:
    name: Linux (ASan + UBSan tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPHONEMIC_BUILD_GUI=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC build + tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/Release/PhoneMic.exe, build/bin/Release/phonemic-receiver.exe, build/bin/Release/phonemic-softphone.exe dist/
          Compress-Archive -Path dist/* -DestinationPath PhoneMic-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-windows
          path: |
            PhoneMic-windows-x64.zip
            build/bin/Release/PhoneMic.exe

  macos:
    name: macOS (experimental)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  driver:
    name: Windows driver (WDK, experimental)
    runs-on: windows-2022
    # Experimental until it builds cleanly; it can't block the rest of CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch ACX headers + import library (the runner's WDK lacks them)
        shell: pwsh
        run: nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.6584 -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive
      - name: Build phonemic.sys
        shell: pwsh
        run: >
          msbuild pc-app/driver/phonemic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off
          /p:PhonemicSkipInf=true /m /v:minimal
          "/p:PhonemicAcxRoot=$env:RUNNER_TEMP\nuget\Microsoft.Windows.WDK.x64.10.0.26100.6584\c"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhoneMic-driver-unsigned
          path: pc-app/driver/x64/Release/

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APKs and run lint
        working-directory: phone-app
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Collect APK
        run: cp phone-app/app/build/outputs/apk/release/app-release.apk PhoneMic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-android
          path: PhoneMic.apk

  release:
    name: Attach binaries to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, sanitizers, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the release if it doesn't exist yet (the old workflow
          # failed unless someone had created it by hand first).
          files: |
            artifacts/PhoneMic-windows/PhoneMic-windows-x64.zip
            artifacts/PhoneMic-windows/build/bin/Release/PhoneMic.exe
            artifacts/PhoneMic-linux/PhoneMic-linux-x64.tar.gz
            artifacts/PhoneMic-android/PhoneMic.apk
