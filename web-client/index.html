<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>PhoneMic</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>PhoneMic</h1>
    <p class="sub">use this phone as your PC's microphone</p>
  </header>

  <section class="card" id="pairCard" hidden>
    <label for="code">Pairing code (shown in the PhoneMic window on your PC)</label>
    <input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" maxlength="32">
  </section>

  <section class="card">
    <div class="status"><span id="dot" class="dot"></span><span id="status">Ready</span></div>
    <div class="meter" aria-hidden="true"><i id="level"></i></div>
    <label class="row"><input type="checkbox" id="cleanup" checked> Phone noise &amp; echo cleanup</label>
    <div class="stat" id="stat"></div>
  </section>

  <button id="toggle" class="primary">Start mic</button>
  <button id="mute" class="secondary" hidden>Mute</button>

  <p class="hint">Keep this page open while you talk. The screen stays on automatically where supported.</p>
</main>
<script src="app.js"></script>
</body>
</html>
